name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Patch package name
        run: |
          chmod +x ./gradlew
          sed -i 's/moduleDescription *=.*/moduleDescription=Il2CppDumper (${{ github.event.inputs.package_name }})/' module.gradle || true
          sed -i 's/com\.game\.packagename/${{ github.event.inputs.package_name }}/g' module/src/main/cpp/game.h
          echo "===== game.h now ====="
          cat module/src/main/cpp/game.h

      - name: Build module
        run: ./gradlew :module:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper
          path: |
            out/magisk_module_release/*.zip
            module/build/outputs/zygisk/*.zip
          if-no-files-found: error
