name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Patch package name
        run: |
          chmod +x ./gradlew
          sed -i 's/com\.game\.packagename/${{ github.event.inputs.package_name }}/g' module/src/main/cpp/game.h
          echo "===== game.h ====="
          cat module/src/main/cpp/game.h
          if ! grep -q "${{ github.event.inputs.package_name }}" module/src/main/cpp/game.h; then
            echo "::error::game.h 里没出现包名，占位符不是 com.game.packagename，看上面的 cat 输出"
            exit 1
          fi

      - name: Build module
        run: ./gradlew :module:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper
          path: |
            out/magisk_module_release/*.zip
            module/build/outputs/zygisk/*.zip
          if-no-files-found: error
